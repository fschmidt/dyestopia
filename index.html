<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale pins the layout viewport: without it, iOS zooms on fast
         repeated taps — which is exactly what playing a match-3 produces. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Dyestopia – a colour game." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dyestopia" />
    <meta property="og:description" content="Dyestopia – a colour game." />
    <meta property="og:url" content="https://dyestopia.fschmidts.net/" />
    <meta property="og:image" content="https://dyestopia.fschmidts.net/thumbnail.png" />
    <meta property="og:image:alt" content="Four colourful tiles on Dyestopia's dark background." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dyestopia" />
    <meta name="twitter:description" content="Dyestopia – a colour game." />
    <meta name="twitter:image" content="https://dyestopia.fschmidts.net/thumbnail.png" />
    <meta name="theme-color" content="#12101a" />
    <!-- Added to a home screen, the game runs full-screen without browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dyestopia" />
    <title>Dyestopia</title>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
