name: CI

# Pull requests only. A push to `main` is already a merge, and `deploy.yaml`
# builds the same tree on its way to Pages — running this there too would just
# build everything twice.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` is the whole gate: wiki:check, then tsc, then Vite.
      - name: Build
        run: npm run build
